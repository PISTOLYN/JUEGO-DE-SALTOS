name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86
            runtime: win-x86
          - architecture: x64
            runtime: win-x64

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Compilar EXE independiente
        run: dotnet publish JUEGO-DE-SALTOS.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/${{ matrix.architecture }}

      - name: Subir versión ${{ matrix.architecture }}
        uses: actions/upload-artifact@v6
        with:
          name: JuegoDeSaltos-Windows-${{ matrix.architecture }}
          path: artifacts/${{ matrix.architecture }}/
          if-no-files-found: error
